apiVersion: apps/v1
kind: Deployment
metadata:
  name: argos-smartops
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: argos-smartops
  template:
    metadata:
      labels:
        app: argos-smartops
    spec:
      serviceAccountName: argos-smartops
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: argos-smartops
          image: "{{ required "image.repository es obligatorio (ver values.yaml TODO, ADR-013)" .Values.image.repository }}@{{ required "image.digest es obligatorio, nunca desplegar por tag (ADR-013)" .Values.image.digest }}"
          env:
            - name: OIDC_ISSUER_URL
              value: "{{ required "oidc.issuerUrl es obligatorio (Keycloak, ARG-022)" .Values.oidc.issuerUrl }}"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
